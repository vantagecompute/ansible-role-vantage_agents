---
# cluster-presence-agent: reports this cluster's presence to Vantage once a
# minute, which is what makes the cluster show as Connected. Installed by its
# own systemd-setup, as v8x does.

- name: Fetch the cluster-presence-agent binary
  ansible.builtin.include_tasks: fetch_binary.yml
  vars:
    vantage_agents_binary_name: cluster-presence-agent
    vantage_agents_binary_version: "{{ vantage_agents_presence_agent_version }}"

- name: Install cluster-presence-agent as a service
  ansible.builtin.command: "{{ vantage_agents_binary_staged }} systemd-setup"
  when: vantage_agents_binary_needs_install | bool
  changed_when: true

- name: Write the presence agent settings
  ansible.builtin.template:
    src: cluster-presence-agent.env.j2
    dest: "{{ vantage_agents_presence_dir }}/env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Enable and start the presence agent timer
  ansible.builtin.systemd_service:
    name: cluster-presence-agent.timer
    enabled: true
    state: started
    daemon_reload: true
