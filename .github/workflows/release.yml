name: Release
# Pushing a version tag such as 0.1.0 publishes that version of the role to
# Ansible Galaxy as vantagecompute.vantage_agents. Galaxy reads the role from this
# repository, so the repository must be public, and it lists one version per
# tag. GALAXY_API_KEY is an API token of a Galaxy user who owns the
# vantagecompute namespace.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  galaxy:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint the role
        # ansible-core 2.22 warns about its own deprecated callbacks when
        # ansible-lint lists plugins. That is not about this role.
        env:
          ANSIBLE_DEPRECATION_WARNINGS: "False"
        run: pipx run ansible-lint
      # Galaxy answers an import into a namespace it does not have with a bare
      # HTTP 500. Galaxy creates a namespace for a user's own GitHub login only;
      # one named after an organization has to be requested from the Galaxy
      # admins, who also add its owners.
      - name: Check the Galaxy namespace exists
        run: |
          count="$(curl -fsS --retry 3 'https://galaxy.ansible.com/api/v1/namespaces/?name=vantagecompute' | jq -r '.count')"
          if [ "$count" = "0" ]; then
              echo "::error::Ansible Galaxy has no vantagecompute namespace, so the import would fail with HTTP 500. Request the namespace from the Galaxy admins, with the owner of GALAXY_API_KEY as an owner, then re-run this job."
              exit 1
          fi
      - name: Import the role into Ansible Galaxy
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
        run: |
          if [ -z "$GALAXY_API_KEY" ]; then
              echo "::error::The GALAXY_API_KEY secret is not set."
              exit 1
          fi
          pipx run --spec ansible-core ansible-galaxy role import \
              --token "$GALAXY_API_KEY" \
              --role-name vantage_agents \
              vantagecompute ansible-role-vantage_agents
