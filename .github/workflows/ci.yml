name: CI
on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint the role
        run: pipx run ansible-lint
      - name: Check the test playbooks parse
        run: pipx run --spec ansible-core ansible-playbook --syntax-check -i localhost, tests/converge.yml

  commitlint:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: Validate PR commits with commitlint
        run: |
          tools="$RUNNER_TEMP/commitlint"
          mkdir -p "$tools"
          (cd "$tools" && npm init -y >/dev/null && npm install --silent @commitlint/cli@21.2.4 @commitlint/config-conventional@21.2.4)
          ln -sfn "$tools/node_modules" node_modules
          "$tools/node_modules/.bin/commitlint" --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
