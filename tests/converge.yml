---
# Apply the role against the stub CDN. Test use only.
- name: Apply the vantage_agents role
  hosts: all
  become: true
  vars:
    vantage_agents_client_id: test-cluster
    vantage_agents_client_secret: 'a "quoted" \ secret'
    vantage_agents_oidc_base_url: http://127.0.0.1:8099
    vantage_agents_artifacts_url: http://127.0.0.1:8099
    vantage_agents_ldap_url: ldaps://ldap.example.test
    vantage_agents_ldap_organization_id: org-123
    vantage_agents_ldap_bind_password: bind-password
    vantage_agents_vref_api_url: https://vref.example.test
    vantage_agents_api_base_url: https://api.example.test
  roles:
    - role: "{{ playbook_dir }}/.."
